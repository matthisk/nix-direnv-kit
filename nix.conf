# nix-direnv-kit: single-user Nix inside a Docker Sandbox.
experimental-features = nix-command flakes
# No nixbld users or daemon; the agent user owns /nix.
build-users-group =
# The sandbox VM is already the isolation boundary, and Nix's own build
# sandbox needs namespaces a container may not grant.
sandbox = false
max-jobs = auto
# The sbx proxy's CA is installed into the system trust store.
ssl-cert-file = /etc/ssl/certs/ca-certificates.crt
# Keep the dev-shell build inputs alive across `nix store gc`.
keep-outputs = true
keep-derivations = true
