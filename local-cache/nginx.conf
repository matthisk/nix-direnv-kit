# Pull-through cache for cache.nixos.org, for the kit's localCache arg.
# Serves upstream bytes unchanged, so cache.nixos.org's signatures still
# verify and no extra trusted key is needed. See README "Local binary cache".
proxy_cache_path /cache levels=1:2 keys_zone=nix:100m max_size=50g inactive=365d use_temp_path=off;

server {
  listen 8080;

  location / {
    proxy_pass https://cache.nixos.org;
    proxy_set_header Host cache.nixos.org;
    proxy_ssl_server_name on;

    proxy_cache nix;
    # Concurrent requests for the same NAR share one upstream fetch.
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    # NARs and narinfos are immutable; a missing path may be published later.
    proxy_cache_valid 200 365d;
    proxy_cache_valid 404 1m;
  }
}
